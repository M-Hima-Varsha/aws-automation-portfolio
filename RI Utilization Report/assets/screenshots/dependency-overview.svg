<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
  <title id="title">RI Utilization Automation Dependencies</title>
  <desc id="desc">Dependency diagram showing Python, boto3, python-dateutil, openpyxl, AWS APIs, CSV outputs, and Excel report output.</desc>
  <rect width="920" height="330" fill="#101820"/>
  <rect x="28" y="26" width="864" height="278" rx="8" fill="#17232f" stroke="#35506a"/>
  <text x="460" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ffffff">Dependency Overview</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">
    <rect x="62" y="118" width="150" height="74" rx="6" fill="#0b5f83" stroke="#5fb4d8"/>
    <text x="137" y="150" text-anchor="middle" font-weight="700">Python</text>
    <text x="137" y="174" text-anchor="middle" font-size="13">Runtime</text>
    <rect x="278" y="92" width="150" height="58" rx="6" fill="#204f79" stroke="#6ea7dc"/>
    <text x="353" y="126" text-anchor="middle" font-weight="700">boto3</text>
    <rect x="278" y="162" width="150" height="58" rx="6" fill="#204f79" stroke="#6ea7dc"/>
    <text x="353" y="196" text-anchor="middle" font-weight="700">python-dateutil</text>
    <rect x="278" y="232" width="150" height="58" rx="6" fill="#204f79" stroke="#6ea7dc"/>
    <text x="353" y="266" text-anchor="middle" font-weight="700">openpyxl</text>
    <rect x="506" y="92" width="150" height="58" rx="6" fill="#2b6b4f" stroke="#78c6a2"/>
    <text x="581" y="117" text-anchor="middle" font-weight="700">AWS APIs</text>
    <text x="581" y="137" text-anchor="middle" font-size="12">STS / CE / Pricing</text>
    <rect x="506" y="232" width="150" height="58" rx="6" fill="#5a5130" stroke="#cfbd67"/>
    <text x="581" y="266" text-anchor="middle" font-weight="700">Excel Workbook</text>
    <rect x="708" y="162" width="150" height="58" rx="6" fill="#5a5130" stroke="#cfbd67"/>
    <text x="783" y="186" text-anchor="middle" font-weight="700">CSV Snapshots</text>
    <text x="783" y="205" text-anchor="middle" font-size="12">Monthly folder</text>
  </g>
  <g stroke="#9fb6c8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M212 155 H278"/>
    <path d="M428 121 H506"/>
    <path d="M428 191 H708"/>
    <path d="M428 261 H506"/>
    <path d="M656 121 C700 121 708 143 740 162"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb6c8"/>
    </marker>
  </defs>
</svg>
