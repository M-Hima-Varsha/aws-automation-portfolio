<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Reserved Instance Purchase Flow</title>
  <desc id="desc">Diagram showing high-level Reserved Instance purchase steps from usage review to confirmed reservation.</desc>
  <rect width="920" height="390" fill="#101820"/>
  <rect x="28" y="26" width="864" height="338" rx="8" fill="#17232f" stroke="#35506a"/>
  <text x="460" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ffffff">Reserved Instance Purchase Flow</text>
  <text x="460" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7d6">Teams usually review steady usage first, then purchase the matching reservation.</text>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">
    <rect x="62" y="148" width="134" height="76" rx="6" fill="#0b5f83" stroke="#5fb4d8"/>
    <text x="129" y="178" text-anchor="middle" font-size="15" font-weight="700">Review Usage</text>
    <text x="129" y="201" text-anchor="middle" font-size="12">Find steady workloads</text>

    <path d="M198 186 H246" fill="none" stroke="#7e96ad" stroke-width="2"/>
    <path d="M246 186 l-10 -7 v14 z" fill="#7e96ad"/>

    <rect x="258" y="148" width="134" height="76" rx="6" fill="#204f79" stroke="#6ea7dc"/>
    <text x="325" y="178" text-anchor="middle" font-size="15" font-weight="700">Choose Service</text>
    <text x="325" y="201" text-anchor="middle" font-size="12">EC2, RDS, Cache</text>

    <path d="M394 186 H442" fill="none" stroke="#7e96ad" stroke-width="2"/>
    <path d="M442 186 l-10 -7 v14 z" fill="#7e96ad"/>

    <rect x="454" y="148" width="134" height="76" rx="6" fill="#2b6b4f" stroke="#78c6a2"/>
    <text x="521" y="178" text-anchor="middle" font-size="15" font-weight="700">Select Details</text>
    <text x="521" y="201" text-anchor="middle" font-size="12">Type, region, term</text>

    <path d="M590 186 H638" fill="none" stroke="#7e96ad" stroke-width="2"/>
    <path d="M638 186 l-10 -7 v14 z" fill="#7e96ad"/>

    <rect x="650" y="148" width="134" height="76" rx="6" fill="#5a5130" stroke="#cfbd67"/>
    <text x="717" y="178" text-anchor="middle" font-size="15" font-weight="700">Confirm</text>
    <text x="717" y="201" text-anchor="middle" font-size="12">Purchase RI</text>

    <path d="M717 226 V266 H461" fill="none" stroke="#7e96ad" stroke-width="2"/>
    <path d="M461 266 l10 -7 v14 z" fill="#7e96ad"/>

    <rect x="250" y="252" width="210" height="66" rx="6" fill="#60405f" stroke="#c18ac0"/>
    <text x="355" y="278" text-anchor="middle" font-size="15" font-weight="700">Discount Applies</text>
    <text x="355" y="300" text-anchor="middle" font-size="12">When matching usage exists</text>
  </g>
</svg>
