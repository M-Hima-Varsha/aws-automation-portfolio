<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">RI Utilization Output Flow</title>
  <desc id="desc">Flow diagram showing Cost Explorer API data converted into local CSV snapshots and a formatted Excel report.</desc>
  <rect width="960" height="360" fill="#101820"/>
  <rect x="30" y="28" width="900" height="304" rx="8" fill="#17232f" stroke="#35506a"/>
  <text x="480" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ffffff">Output Flow</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">
    <rect x="66" y="138" width="160" height="78" rx="6" fill="#2b6b4f" stroke="#78c6a2"/>
    <text x="146" y="168" text-anchor="middle" font-size="15" font-weight="700">AWS Cost Explorer</text>
    <text x="146" y="192" text-anchor="middle" font-size="12">API response data</text>
    <rect x="300" y="98" width="160" height="78" rx="6" fill="#0b5f83" stroke="#5fb4d8"/>
    <text x="380" y="128" text-anchor="middle" font-size="15" font-weight="700">Python Script</text>
    <text x="380" y="152" text-anchor="middle" font-size="12">Normalize rows</text>
    <rect x="300" y="218" width="160" height="78" rx="6" fill="#0b5f83" stroke="#5fb4d8"/>
    <text x="380" y="248" text-anchor="middle" font-size="15" font-weight="700">Local CSV Files</text>
    <text x="380" y="272" text-anchor="middle" font-size="12">&lt;Month&gt; - &lt;Year&gt;/</text>
    <rect x="548" y="138" width="160" height="78" rx="6" fill="#5a5130" stroke="#cfbd67"/>
    <text x="628" y="168" text-anchor="middle" font-size="15" font-weight="700">openpyxl</text>
    <text x="628" y="192" text-anchor="middle" font-size="12">Format workbook</text>
    <rect x="770" y="138" width="140" height="78" rx="6" fill="#4d405f" stroke="#b8a0d8"/>
    <text x="840" y="168" text-anchor="middle" font-size="15" font-weight="700">Excel Report</text>
    <text x="840" y="192" text-anchor="middle" font-size="12">RI Utilization</text>
  </g>
  <g stroke="#9fb6c8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M226 177 H300"/>
    <path d="M380 176 V218"/>
    <path d="M460 257 C510 257 506 177 548 177"/>
    <path d="M708 177 H770"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb6c8"/>
    </marker>
  </defs>
</svg>
