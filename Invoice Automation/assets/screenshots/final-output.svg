<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Script Execution and Final Output Reference</title>
  <desc id="desc">Shows the terminal output when running invoice-automation.py and the resulting Excel report file that is generated.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title-text { fill: #18324a; font: 700 28px Arial, sans-serif; }
      .subtitle-text { fill: #53697d; font: 400 15px Arial, sans-serif; }

      /* Terminal */
      .terminal { fill: #1e1e2e; }
      .terminal-bar { fill: #2d2d3f; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .bar-text { fill: #9a9ab0; font: 400 13px Arial, sans-serif; }
      .prompt { fill: #50fa7b; font: 400 14px 'Courier New', monospace; }
      .cmd { fill: #f8f8f2; font: 400 14px 'Courier New', monospace; }
      .out-cyan { fill: #8be9fd; font: 400 14px 'Courier New', monospace; }
      .out-white { fill: #f8f8f2; font: 400 14px 'Courier New', monospace; }
      .out-green { fill: #50fa7b; font: 700 14px 'Courier New', monospace; }
      .out-orange { fill: #ffb86c; font: 700 14px 'Courier New', monospace; }

      /* Excel preview */
      .excel-panel { fill: #ffffff; stroke: #cfd9e3; stroke-width: 2; }
      .excel-title-bar { fill: #217346; }
      .excel-title-text { fill: #ffffff; font: 700 14px Arial, sans-serif; }
      .excel-hdr-row { fill: #1f4e78; }
      .excel-hdr-text { fill: #ffffff; font: 700 12px Arial, sans-serif; }
      .excel-col-hdr { fill: #d9eaf7; }
      .excel-col-text { fill: #1f2d3a; font: 700 11px Arial, sans-serif; }
      .excel-cell { fill: #2d3f50; font: 400 11px Arial, sans-serif; }
      .excel-total { fill: #d9eaf7; }
      .excel-total-text { fill: #1f4e78; font: 700 11px Arial, sans-serif; }
      .excel-grand { fill: #cfe8d8; }
      .excel-grand-text { fill: #1a5c35; font: 700 12px Arial, sans-serif; }
      .excel-blank { fill: #f9fbfd; }
      .row-line { stroke: #aebdca; stroke-width: 1; }
      .col-line { stroke: #aebdca; stroke-width: 1; }

      /* Arrow */
      .arrow { stroke: #2f80ed; stroke-width: 3; fill: none; marker-end: url(#arr); }

      /* Labels */
      .label-box { fill: #e8f2ff; stroke: #8dbdf5; stroke-width: 1.5; }
      .label-text { fill: #1f5f9f; font: 700 13px Arial, sans-serif; }
      .note-box { fill: #fff8e1; stroke: #f0c040; stroke-width: 1.5; }
      .note-text { fill: #7a5c00; font: 400 13px Arial, sans-serif; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2f80ed"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>

  <text class="title-text" x="60" y="52">Script Execution and Final Output Reference</text>
  <text class="subtitle-text" x="60" y="78">Run the script → see this terminal output → open the generated Excel file.</text>

  <!-- ===== LEFT: Terminal ===== -->
  <rect class="terminal" x="60" y="105" width="530" height="310" rx="12"/>
  <rect class="terminal-bar" x="60" y="105" width="530" height="36" rx="12"/>
  <rect class="terminal-bar" x="60" y="129" width="530" height="12"/>
  <circle class="dot-red"    cx="88"  cy="123" r="7"/>
  <circle class="dot-yellow" cx="112" cy="123" r="7"/>
  <circle class="dot-green"  cx="136" cy="123" r="7"/>
  <text class="bar-text" x="325" y="128" text-anchor="middle">PowerShell</text>

  <text class="prompt"    x="82" y="165">PS C:\Invoice Automation&gt;</text>
  <text class="cmd"       x="310" y="165">python invoice-automation.py</text>

  <text class="out-cyan"  x="82" y="195">Validating invoice billing period...</text>

  <text class="out-cyan"  x="82" y="225">Processing invoices for:</text>
  <text class="out-white" x="300" y="225">April-2026</text>

  <text class="out-cyan"  x="82" y="255">Processing invoices...</text>

  <text class="out-cyan"  x="82" y="285">Exporting to Excel...</text>

  <text class="out-green" x="82" y="320">Invoice Report is updated for April-2026 :</text>
  <text class="out-orange" x="82" y="345">Invoice_Report_Dev&amp;Prod-April-2026.xlsx</text>

  <text class="prompt"    x="82" y="385">PS C:\Invoice Automation&gt;</text>

  <!-- Label under terminal -->
  <rect class="label-box" x="60" y="428" width="530" height="32" rx="8"/>
  <text class="label-text" x="325" y="449" text-anchor="middle">Step 1 — Run:  python invoice-automation.py</text>

  <!-- Arrow -->
  <path class="arrow" d="M610 260 H650"/>

  <!-- ===== RIGHT: Excel preview ===== -->
  <rect class="excel-panel" x="660" y="105" width="480" height="355" rx="12"/>

  <!-- Excel title bar (green) -->
  <rect class="excel-title-bar" x="660" y="105" width="480" height="34" rx="12"/>
  <rect class="excel-title-bar" x="660" y="127" width="480" height="12"/>
  <text class="excel-title-text" x="900" y="128" text-anchor="middle">📊  Invoice_Report_Dev&amp;Prod-April-2026.xlsx</text>

  <!-- Row 1: Report title (merged) -->
  <rect class="excel-hdr-row" x="660" y="139" width="480" height="30"/>
  <text class="excel-hdr-text" x="900" y="159" text-anchor="middle">Invoice Report - April</text>

  <!-- Row 2: Column headers -->
  <rect class="excel-col-hdr" x="660" y="169" width="480" height="26"/>
  <line class="row-line" x1="660" y1="195" x2="1140" y2="195"/>

  <!-- Column dividers -->
  <line class="col-line" x1="760" y1="169" x2="760" y2="460"/>
  <line class="col-line" x1="820" y1="169" x2="820" y2="460"/>
  <line class="col-line" x1="880" y1="169" x2="880" y2="460"/>
  <line class="col-line" x1="940" y1="169" x2="940" y2="460"/>
  <line class="col-line" x1="1000" y1="169" x2="1000" y2="460"/>
  <line class="col-line" x1="1060" y1="169" x2="1060" y2="460"/>

  <text class="excel-col-text" x="710" y="186" text-anchor="middle">Account</text>
  <text class="excel-col-text" x="790" y="186" text-anchor="middle">Env</text>
  <text class="excel-col-text" x="850" y="186" text-anchor="middle">Month</text>
  <text class="excel-col-text" x="910" y="186" text-anchor="middle">Invoice No</text>
  <text class="excel-col-text" x="970" y="186" text-anchor="middle">Amount</text>
  <text class="excel-col-text" x="1030" y="186" text-anchor="middle">Total</text>
  <text class="excel-col-text" x="1100" y="186" text-anchor="middle">Remarks</text>

  <!-- Account A row 1 -->
  <line class="row-line" x1="660" y1="218" x2="1140" y2="218"/>
  <text class="excel-cell" x="710" y="210" text-anchor="middle">Dev-Acct-A</text>
  <text class="excel-cell" x="790" y="210" text-anchor="middle">AWS</text>
  <text class="excel-cell" x="850" y="210" text-anchor="middle">April</text>
  <text class="excel-cell" x="910" y="210" text-anchor="middle">2599619865</text>
  <text class="excel-cell" x="970" y="210" text-anchor="middle">$381.84</text>
  <rect class="excel-total" x="1000" y="195" width="60" height="46"/>
  <text class="excel-total-text" x="1030" y="222" text-anchor="middle">$512.41</text>
  <text class="excel-cell" x="1100" y="210" text-anchor="middle">AWS Services Cost</text>

  <!-- Account A row 2 -->
  <line class="row-line" x1="660" y1="241" x2="1140" y2="241"/>
  <text class="excel-cell" x="850" y="234" text-anchor="middle">April</text>
  <text class="excel-cell" x="910" y="234" text-anchor="middle">2599619865</text>
  <text class="excel-cell" x="970" y="234" text-anchor="middle">$130.57</text>
  <text class="excel-cell" x="1100" y="234" text-anchor="middle">Marketplace Charge</text>

  <!-- Blank row -->
  <rect class="excel-blank" x="661" y="241" width="478" height="16"/>
  <line class="row-line" x1="660" y1="257" x2="1140" y2="257"/>

  <!-- Account B row -->
  <line class="row-line" x1="660" y1="280" x2="1140" y2="280"/>
  <text class="excel-cell" x="710" y="272" text-anchor="middle">Prod-Acct-B</text>
  <text class="excel-cell" x="790" y="272" text-anchor="middle">AWS</text>
  <text class="excel-cell" x="850" y="272" text-anchor="middle">April</text>
  <text class="excel-cell" x="910" y="272" text-anchor="middle">2599627709</text>
  <text class="excel-cell" x="970" y="272" text-anchor="middle">$103.95</text>
  <rect class="excel-total" x="1000" y="257" width="60" height="23"/>
  <text class="excel-total-text" x="1030" y="272" text-anchor="middle">$103.95</text>
  <text class="excel-cell" x="1100" y="272" text-anchor="middle">AWS Services Cost</text>

  <!-- Blank row -->
  <rect class="excel-blank" x="661" y="280" width="478" height="16"/>
  <line class="row-line" x1="660" y1="296" x2="1140" y2="296"/>

  <!-- Account C row -->
  <line class="row-line" x1="660" y1="319" x2="1140" y2="319"/>
  <text class="excel-cell" x="710" y="311" text-anchor="middle">Sandbox-C</text>
  <text class="excel-cell" x="790" y="311" text-anchor="middle">AWS</text>
  <text class="excel-cell" x="850" y="311" text-anchor="middle">April</text>
  <text class="excel-cell" x="910" y="311" text-anchor="middle">2608674241</text>
  <text class="excel-cell" x="970" y="311" text-anchor="middle">$58.20</text>
  <rect class="excel-total" x="1000" y="296" width="60" height="23"/>
  <text class="excel-total-text" x="1030" y="311" text-anchor="middle">$58.20</text>
  <text class="excel-cell" x="1100" y="311" text-anchor="middle">AWS Services Cost</text>

  <!-- Blank row -->
  <rect class="excel-blank" x="661" y="319" width="478" height="16"/>
  <line class="row-line" x1="660" y1="335" x2="1140" y2="335"/>

  <!-- Grand Total row -->
  <rect class="excel-grand" x="661" y="335" width="478" height="30"/>
  <line class="row-line" x1="660" y1="365" x2="1140" y2="365"/>
  <text class="excel-grand-text" x="840" y="355" text-anchor="middle">Grand Total</text>
  <text class="excel-grand-text" x="1030" y="355" text-anchor="middle">$674.56</text>

  <!-- Dots indicating more rows -->
  <text x="900" y="390" text-anchor="middle" fill="#aebdca" font-family="Arial,sans-serif" font-size="18">• • •</text>
  <text x="900" y="410" text-anchor="middle" fill="#7a8fa0" font-family="Arial,sans-serif" font-size="12">more accounts above grand total</text>
  <line class="row-line" x1="660" y1="420" x2="1140" y2="420"/>
  <line class="row-line" x1="660" y1="460" x2="1140" y2="460"/>

  <!-- Label under Excel -->
  <rect class="label-box" x="660" y="428" width="480" height="32" rx="8"/>
  <text class="label-text" x="900" y="449" text-anchor="middle">Step 2 — Open the generated .xlsx file in Excel</text>

  <!-- Note bar at bottom -->
  <rect class="note-box" x="60" y="490" width="1080" height="80" rx="10"/>
  <text x="80" y="514" fill="#7a5c00" font-family="Arial,sans-serif" font-size="13" font-weight="700">⚠  Things to check after running:</text>
  <text class="note-text" x="80" y="536">1.  The output file is saved in the same folder as invoice-automation.py — look for  Invoice_Report_Dev&amp;Prod-&lt;Month&gt;-&lt;Year&gt;.xlsx</text>
  <text class="note-text" x="80" y="556">2.  Open the file in Excel — formula values in the Total and Grand Total columns will calculate automatically on open.</text>
  <text class="note-text" x="80" y="576">3.  If the script says "Unable to update" — close the Excel file first, then rerun the script.</text>
</svg>
