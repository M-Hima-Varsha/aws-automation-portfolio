<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Excel Invoice Report Layout</title>
  <desc id="desc">Illustration of the generated Excel report with account rows, dollar-formatted amounts, account totals, blank row spacing, and grand total.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title-text { fill: #18324a; font: 700 28px Arial, sans-serif; }
      .subtitle-text { fill: #53697d; font: 400 15px Arial, sans-serif; }
      .tbl-border { fill: #ffffff; stroke: #aebdca; stroke-width: 2; }
      .row-line { stroke: #aebdca; stroke-width: 1; }
      .col-line { stroke: #aebdca; stroke-width: 1; }
      .hdr-title { fill: #1f4e78; }
      .hdr-title-text { fill: #ffffff; font: 700 14px Arial, sans-serif; }
      .hdr-col { fill: #d9eaf7; }
      .hdr-col-text { fill: #1f2d3a; font: 700 13px Arial, sans-serif; }
      .cell { fill: #2d3f50; font: 400 13px Arial, sans-serif; }
      .cell-mono { fill: #2d3f50; font: 400 13px 'Courier New', monospace; }
      .cell-remark { fill: #2d3f50; font: 400 12px Arial, sans-serif; }
      .total-cell { fill: #d9eaf7; }
      .total-text { fill: #1f4e78; font: 700 13px Arial, sans-serif; }
      .grand-row { fill: #cfe8d8; }
      .grand-text { fill: #1a5c35; font: 700 14px Arial, sans-serif; }
      .blank-row { fill: #f9fbfd; }
      .annot { fill: #7a8fa0; font: 400 12px Arial, sans-serif; font-style: italic; }
      .annot-line { stroke: #aebdca; stroke-width: 1; stroke-dasharray: 4 3; }
      .legend-box { fill: #ffffff; stroke: #cfd9e3; stroke-width: 1.5; }
      .legend-text { fill: #52677a; font: 400 12px Arial, sans-serif; }
      .legend-title { fill: #18324a; font: 700 13px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <text class="title-text" x="60" y="52">Generated Excel Invoice Report Layout</text>
  <text class="subtitle-text" x="60" y="76">Account-wise details, dollar-formatted costs, account totals, blank row spacing, and final grand total.</text>

  <!-- Column positions: A=60, B=220, C=360, D=480, E=620, F=760, G=880 end=1140 -->
  <!-- Row heights: title=40, header=36, data=34, blank=22, grand=38 -->

  <!-- Table outer border -->
  <rect class="tbl-border" x="60" y="100" width="1080" height="530" rx="10"/>

  <!-- ROW 1: Title row (merged A-G) -->
  <rect class="hdr-title" x="60" y="100" width="1080" height="40" rx="10"/>
  <rect class="hdr-title" x="60" y="128" width="1080" height="12"/>
  <text class="hdr-title-text" x="600" y="126" text-anchor="middle">Invoice Report - April</text>

  <!-- ROW 2: Column headers -->
  <rect class="hdr-col" x="60" y="140" width="1080" height="36"/>
  <line class="row-line" x1="60" y1="176" x2="1140" y2="176"/>

  <!-- Column dividers (all rows) -->
  <line class="col-line" x1="220" y1="140" x2="220" y2="630"/>
  <line class="col-line" x1="360" y1="140" x2="360" y2="630"/>
  <line class="col-line" x1="480" y1="140" x2="480" y2="630"/>
  <line class="col-line" x1="640" y1="140" x2="640" y2="630"/>
  <line class="col-line" x1="760" y1="140" x2="760" y2="630"/>
  <line class="col-line" x1="880" y1="140" x2="880" y2="630"/>

  <!-- Header labels -->
  <text class="hdr-col-text" x="140" y="163" text-anchor="middle">Account</text>
  <text class="hdr-col-text" x="290" y="163" text-anchor="middle">Environment Type</text>
  <text class="hdr-col-text" x="420" y="163" text-anchor="middle">Month</text>
  <text class="hdr-col-text" x="560" y="163" text-anchor="middle">Invoice No</text>
  <text class="hdr-col-text" x="700" y="163" text-anchor="middle">Amount</text>
  <text class="hdr-col-text" x="820" y="163" text-anchor="middle">Total</text>
  <text class="hdr-col-text" x="1010" y="163" text-anchor="middle">Remarks</text>

  <!-- ===== ACCOUNT A — 3 rows ===== -->
  <!-- Row 3 -->
  <line class="row-line" x1="60" y1="210" x2="1140" y2="210"/>
  <!-- Row 4 -->
  <line class="row-line" x1="60" y1="244" x2="1140" y2="244"/>
  <!-- Row 5 -->
  <line class="row-line" x1="60" y1="278" x2="1140" y2="278"/>

  <!-- Account A merged (rows 3-5, col A) -->
  <text class="cell" x="140" y="232" text-anchor="middle">Dev-Account-A</text>
  <!-- Environment merged (rows 3-5, col B) -->
  <text class="cell" x="290" y="232" text-anchor="middle">AWS</text>
  <!-- Total cell merged (rows 3-5, col F) -->
  <rect class="total-cell" x="760" y="176" width="120" height="102"/>
  <text class="total-text" x="820" y="232" text-anchor="middle">=SUM(E3:E5)</text>
  <text class="total-text" x="820" y="250" text-anchor="middle">$512.41</text>

  <!-- Row 3 data -->
  <text class="cell" x="420" y="197" text-anchor="middle">April</text>
  <text class="cell-mono" x="560" y="197" text-anchor="middle">2599619865</text>
  <text class="cell" x="700" y="197" text-anchor="middle">$381.84</text>
  <text class="cell-remark" x="1010" y="197" text-anchor="middle">AWS Services Cost</text>

  <!-- Row 4 data -->
  <text class="cell" x="420" y="231" text-anchor="middle">April</text>
  <text class="cell-mono" x="560" y="231" text-anchor="middle">2599619865</text>
  <text class="cell" x="700" y="231" text-anchor="middle">$100.00</text>
  <text class="cell-remark" x="1010" y="228" text-anchor="middle">AWS Market Place Charges -</text>
  <text class="cell-remark" x="1010" y="242" text-anchor="middle">SolarWinds sold by SolarWinds</text>

  <!-- Row 5 data -->
  <text class="cell" x="420" y="265" text-anchor="middle">April</text>
  <text class="cell-mono" x="560" y="265" text-anchor="middle">2599619865</text>
  <text class="cell" x="700" y="265" text-anchor="middle">$30.57</text>
  <text class="cell-remark" x="1010" y="265" text-anchor="middle">OBC Late Fee</text>

  <!-- ===== BLANK ROW after Account A ===== -->
  <rect class="blank-row" x="61" y="278" width="1078" height="22"/>
  <line class="row-line" x1="60" y1="300" x2="1140" y2="300"/>
  <text class="annot" x="600" y="294" text-anchor="middle">— blank row separating account groups —</text>

  <!-- ===== ACCOUNT B — 1 row ===== -->
  <line class="row-line" x1="60" y1="334" x2="1140" y2="334"/>
  <text class="cell" x="140" y="321" text-anchor="middle">Prod-Account-B</text>
  <text class="cell" x="290" y="321" text-anchor="middle">AWS</text>
  <text class="cell" x="420" y="321" text-anchor="middle">April</text>
  <text class="cell-mono" x="560" y="321" text-anchor="middle">2599627709</text>
  <text class="cell" x="700" y="321" text-anchor="middle">$103.95</text>
  <rect class="total-cell" x="760" y="300" width="120" height="34"/>
  <text class="total-text" x="820" y="321" text-anchor="middle">$103.95</text>
  <text class="cell-remark" x="1010" y="321" text-anchor="middle">AWS Services Cost</text>

  <!-- ===== BLANK ROW after Account B ===== -->
  <rect class="blank-row" x="61" y="334" width="1078" height="22"/>
  <line class="row-line" x1="60" y1="356" x2="1140" y2="356"/>
  <text class="annot" x="600" y="350" text-anchor="middle">— blank row separating account groups —</text>

  <!-- ===== ACCOUNT C — 1 row ===== -->
  <line class="row-line" x1="60" y1="390" x2="1140" y2="390"/>
  <text class="cell" x="140" y="377" text-anchor="middle">Sandbox-Account-C</text>
  <text class="cell" x="290" y="377" text-anchor="middle">AWS</text>
  <text class="cell" x="420" y="377" text-anchor="middle">April</text>
  <text class="cell-mono" x="560" y="377" text-anchor="middle">2608674241</text>
  <text class="cell" x="700" y="377" text-anchor="middle">$58.20</text>
  <rect class="total-cell" x="760" y="356" width="120" height="34"/>
  <text class="total-text" x="820" y="377" text-anchor="middle">$58.20</text>
  <text class="cell-remark" x="1010" y="377" text-anchor="middle">AWS Services Cost</text>

  <!-- ===== BLANK ROW after Account C ===== -->
  <rect class="blank-row" x="61" y="390" width="1078" height="22"/>
  <line class="row-line" x1="60" y1="412" x2="1140" y2="412"/>
  <text class="annot" x="600" y="406" text-anchor="middle">— blank row separating account groups —</text>

  <!-- ===== GRAND TOTAL ROW ===== -->
  <rect class="grand-row" x="61" y="412" width="1078" height="42"/>
  <line class="row-line" x1="60" y1="454" x2="1140" y2="454"/>
  <!-- Grand Total label spanning cols A-E -->
  <text class="grand-text" x="410" y="438" text-anchor="middle">Grand Total</text>
  <!-- Grand Total value inside col F only (760 to 880) -->
  <rect fill="#a8d5b5" x="760" y="412" width="120" height="42"/>
  <text class="grand-text" x="820" y="438" text-anchor="middle">$674.56</text>

  <!-- Annotation lines -->
  <!-- Total column annotation -->
  <line class="annot-line" x1="880" y1="227" x2="1000" y2="470"/>
  <text class="annot" x="1010" y="480" text-anchor="middle">Account total = SUM of all</text>
  <text class="annot" x="1010" y="494" text-anchor="middle">Amount rows for that account</text>

  <!-- Grand total annotation -->
  <line class="annot-line" x1="880" y1="438" x2="1000" y2="530"/>
  <text class="annot" x="1010" y="540" text-anchor="middle">Grand total sits under col F</text>
  <text class="annot" x="1010" y="554" text-anchor="middle">=SUM(F3,F8,F12)</text>

  <!-- Legend -->
  <rect class="legend-box" x="60" y="580" width="860" height="100" rx="10"/>
  <text class="legend-title" x="80" y="604">Legend</text>

  <rect fill="#d9eaf7" x="80" y="616" width="18" height="14" rx="3"/>
  <text class="legend-text" x="106" y="628">Account Total cell (column F) — shows =SUM(E_start:E_end) formula</text>

  <rect fill="#a8d5b5" x="80" y="642" width="18" height="14" rx="3"/>
  <text class="legend-text" x="106" y="654">Grand Total row — grand total value appears under Total column (col F), sums all account totals</text>

  <rect fill="#f9fbfd" stroke="#aebdca" stroke-width="1" x="80" y="668" width="18" height="14" rx="3"/>
  <text class="legend-text" x="106" y="680">Blank row — added automatically after each account group for readability</text>
</svg>
